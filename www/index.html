          }
          var f = chatBox.querySelector(".faint");
          if (f && chatBox.children.length === 1) chatBox.innerHTML = "";
          addChatLine(payload.new);
        })
        .subscribe();
      async function sendChat() {
        var input = root.querySelector("#streamChatInput");
        var body = input.value.trim();
        if (!body) return;
        input.value = "";
        var ins = await sb.from("stream_messages").insert({ stream_id: stream.id, sender_id: me.id, body: body.slice(0, 500) });
        if (ins.error) { toast("Chat failed: " + errText(ins.error)); input.value = body; return; }
        roomState.profiles[me.id] = me;
        var chk = await sb.from("stream_messages").select("*").eq("stream_id", stream.id).eq("sender_id", me.id).order("created_at", { ascending: false }).limit(1);
        if (chk.data && chk.data[0]) addChatLine(chk.data[0]);
      }
      root.querySelector("#streamChatSend").addEventListener("click", sendChat);
      root.querySelector("#streamChatInput").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });

      /* gifts + balance for the sheet */
      var gRes = await sb.from("gift_catalog").select("*").eq("active", true).order("price_coins", { ascending: true });
      roomState.gifts = gRes.data || [];
      var wRes = await sb.from("wallets").select("balance").eq("user_id", me.id).maybeSingle();
      roomState.balance = wRes.data ? Number(wRes.data.balance) : 0;

      connectRoom();
    }
    function closeStreamRoomSilent() {
      if (roomState) {
        roomState.dead = true;
        if (roomState.chatChannel) { try { sb.removeChannel(roomState.chatChannel); } catch (e) {} }
        teardownRoom();
        roomState = null;
        document.removeEventListener("visibilitychange", roomVisibility);
      }
    }

    async function endStream(silent) {
      if (!roomState) return;
      var stream = roomState.stream;
      try {
        await sb.from("streams").update({ status: "ended", ended_at: new Date().toISOString() }).eq("id", stream.id).eq("host_id", me.id);
      } catch (e) {}
      closeStreamRoom();
      if (!silent) toast("Your stream has ended.");
      if (currentView === "home") navigate("home");
    }

    function setConn(text, cls) {
      var s = $("#connState");
      if (s) { s.textContent = text; s.className = "conn-pill " + cls; }
    }

    async function connectRoom() {
      if (!roomState || roomState.dead) return;
      var stream = roomState.stream;
      setConn("Connecting…", "warn");
      var LK = window.LivekitClient;
      if (!LK) { setConn("Streaming library couldn't load — check your connection", "bad"); return; }
      var tok;
      try {
        tok = await getLiveKitToken(stream.id, roomState.isHost ? "host" : "viewer");
      } catch (e) {
        setConn("Streaming server isn't connected yet", "bad");
        var grid = $("#tileGrid");
        if (grid) grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">Streaming server isn\'t connected yet</div>This stream isn\'t broadcasting right now. Please try again shortly — nothing here is faked in the meantime.</div>';
        if (roomState.isHost) {
          // Don't leave a phantom "live" row behind if we never broadcast.
          sb.from("streams").update({ status: "ended", ended_at: new Date().toISOString() }).eq("id", stream.id).eq("host_id", me.id).then(function () {});
        }
        return;
      }
      if (!roomState || roomState.dead) return;
      var room = new LK.Room({ adaptiveStream: true, dynacast: true });
      roomState.room = room;
      function bump() { collectParticipants(); }
      room.on("participantConnected", bump);
      room.on("participantDisconnected", bump);
      room.on("trackSubscribed", bump);
      room.on("trackUnsubscribed", bump);
      room.on("trackPublished", bump);
      room.on("trackUnpublished", bump);
      room.on("localTrackPublished", bump);
      room.on("localTrackUnpublished", bump);
      room.on("reconnecting", function () { setConn("Reconnecting…", "warn"); });
      room.on("reconnected", function () { setConn("Live — connected", "ok"); });
      room.on("disconnected", function () { if (roomState && !roomState.hidden && !roomState.dead) setConn("Disconnected", "bad"); });
      try {
        await room.connect(tok.url || LIVEKIT_URL, tok.token);
        if (!roomState || roomState.dead) { try { room.disconnect(); } catch (e) {} return; }
        setConn(roomState.isHost ? "Live — you're broadcasting" : "Live — connected", "ok");
        if (roomState.isHost || tok.canPublish) {
          await room.localParticipant.setCameraEnabled(true).catch(function () {});
          await room.localParticipant.setMicrophoneEnabled(true).catch(function () {});
          roomState.micOn = true; roomState.camOn = true;
        }
        collectParticipants();
      } catch (e) {
        setConn("Couldn't connect to the stream — try leaving and rejoining", "bad");
      }
    }

    async function collectParticipants() {
      if (!roomState || !roomState.room) return;
      var room = roomState.room;
      var ids = [room.localParticipant.identity];
      room.remoteParticipants.forEach(function (p) { ids.push(p.identity); });
      roomState.partIds = ids;
      var vc = $("#viewerCount"); if (vc) vc.textContent = ids.length + (ids.length === 1 ? " watching" : " watching");
      var pc = $("#partsCount"); if (pc) pc.textContent = ids.length;
      var missing = ids.filter(function (id) { return !roomState.profiles[id]; });
      if (missing.length) {
        var got = await fetchProfiles(missing);
        Object.keys(got).forEach(function (k) { roomState.profiles[k] = got[k]; });
      }
      renderTiles();
    }

    function renderTiles() {
      var grid = $("#tileGrid");
      if (!grid || !roomState || !roomState.room) return;
      var room = roomState.room;
      var parts = [room.localParticipant];
      room.remoteParticipants.forEach(function (p) { parts.push(p); });
      grid.style.gridTemplateColumns = parts.length > 1 ? "repeat(auto-fit, minmax(150px, 1fr))" : "1fr";
      grid.innerHTML = "";
      parts.forEach(function (p) {
        var isLocal = p === room.localParticipant;
        var prof = roomState.profiles[p.identity];
        var tile = el('<div class="tile"></div>');
        var videoTrack = null;
        p.videoTrackPublications.forEach(function (pub) { if (pub.track && pub.isSubscribed !== false) videoTrack = pub.track; });
        if (!videoTrack) {
          p.trackPublications.forEach(function (pub) { if (pub.kind === "video" && pub.track) videoTrack = pub.track; });
        }
        if (videoTrack) {
          var v = videoTrack.attach();
          v.setAttribute("playsinline", "");
          if (isLocal) v.style.transform = "scaleX(-1)";
          tile.appendChild(v);
        } else {
          var nc = el('<div class="no-cam"></div>');
          nc.innerHTML = avatarHtml(prof, 72);
          tile.appendChild(nc);
        }
        p.audioTrackPublications.forEach(function (pub) {
          if (pub.track && !isLocal) tile.appendChild(pub.track.attach());
        });
        var who = el('<span class="who"></span>');
        who.innerHTML = avatarHtml(prof, 22) + "<span>" + esc(isLocal ? "You" : displayName(prof)) + (p.identity === roomState.stream.host_id ? " · Host" : "") + "</span>";
        tile.appendChild(who);
        grid.appendChild(tile);
      });
    }

    function openParticipantsSheet() {
      if (!roomState) return;
      var ids = roomState.partIds.length ? roomState.partIds : [me.id];
      var sheet = openSheet(
        "<h3>Who's watching</h3>" +
        '<p class="muted small">Real people in this stream right now. Tap someone to see their profile.</p>' +
        '<div class="stack" id="partList"></div>'
      );
      var list = sheet.querySelector("#partList");
      ids.forEach(function (id) {
        var p = roomState.profiles[id];
        var row = el(
          '<button type="button" class="part-row">' + avatarHtml(p, 42) +
          '<span style="flex:1;min-width:0"><span style="display:block;font-weight:800">' + esc(id === me.id ? "You" : displayName(p)) + "</span>" +
          '<span class="faint small">@' + esc(p ? p.username : "") + (id === roomState.stream.host_id ? " · Host" : "") + "</span></span>" +
          (id !== me.id ? '<span class="faint">›</span>' : "") + "</button>"
        );
        if (id !== me.id) {
          row.addEventListener("click", function () {
            closeSheet();
            participantActions(p);
          });
        }
        list.appendChild(row);
      });
    }

    function participantActions(p) {
      if (!p) return;
      var sheet = openSheet(
        '<div style="display:flex;gap:13px;align-items:center">' + avatarHtml(p, 56) +
        '<div><div style="font-weight:800;font-size:18px">' + esc(displayName(p)) + '</div><div class="faint">@' + esc(p.username) + "</div></div></div>" +
        '<div class="stack mt">' +
        '<button type="button" class="btn primary block" id="paProfile">View profile</button>' +
        '<button type="button" class="btn ghost block" id="paFollow">Follow</button>' +
        '<button type="button" class="btn ghost block" id="paMsg">Message</button>' +
        '<button type="button" class="btn ghost block" id="paBlock">' + (blockedIds[p.id] ? "Unblock" : "Block") + "</button>" +
        '<button type="button" class="btn ghost block" id="paReport">Report</button>' +
        '<button type="button" class="btn ghost block" id="paClose">Close</button></div>'
      );
      sheet.querySelector("#paClose").addEventListener("click", closeSheet);
      sheet.querySelector("#paProfile").addEventListener("click", function () { closeSheet(); openProfile(p); });
      sheet.querySelector("#paFollow").addEventListener("click", async function () {
        var ex = await sb.from("follows").select("follower_id").eq("follower_id", me.id).eq("following_id", p.id).maybeSingle();
        if (ex.data) {
          await sb.from("follows").delete().eq("follower_id", me.id).eq("following_id", p.id);
          this.textContent = "Follow"; toast("Unfollowed " + displayName(p) + ".");
        } else {
          var i = await sb.from("follows").insert({ follower_id: me.id, following_id: p.id });
          if (i.error) { toast(errText(i.error)); return; }
          this.textContent = "Following ✓"; toast("Following " + displayName(p) + ".");
        }
      });
      sheet.querySelector("#paMsg").addEventListener("click", async function () {
        var convId = await findOrCreateConversation(p.id);
        if (convId) { closeSheet(); closeStreamRoom(); openConversation(convId, p); }
      });
      sheet.querySelector("#paBlock").addEventListener("click", function () { toggleBlock(p, this); });
      sheet.querySelector("#paReport").addEventListener("click", function () { reportSheet("user", p.id, p.id); });
    }

    function openGiftSheet() {
      if (!roomState) return;
      if (roomState.stream.host_id === me.id) { toast("You can't send gifts to your own stream."); return; }
      var gifts = roomState.gifts;
      var sheet = openSheet(
        "<h3>Send a gift</h3>" +
        '<p class="muted small">Your balance: <b style="color:var(--gold)">' + Number(roomState.balance || 0).toLocaleString() + " coins</b>. " +
        "Gifts are charged by the server only when your real balance covers them.</p>" +
        (gifts.length ? '<div class="gift-grid" id="giftGrid"></div>' : '<div class="empty"><div class="big">No gifts available</div>The gift shelf is empty right now.</div>') +
        '<button type="button" class="btn ghost block mt" id="giftClose">Close</button>'
      );
      sheet.querySelector("#giftClose").addEventListener("click", closeSheet);
      var grid = sheet.querySelector("#giftGrid");
      if (!grid) return;
      gifts.forEach(function (g) {
        var card = el(
          '<button type="button" class="gift-card">' + giftArt(g, 46) +
          '<div class="gname">' + esc(g.name) + '</div>' +
          '<div class="gprice"><span class="coin-ic"></span>' + Number(g.price_coins).toLocaleString() + "</div>" +
          (g.rarity ? '<div class="faint" style="font-size:12px;text-transform:capitalize">' + esc(g.rarity) + "</div>" : "") + "</button>"
        );
        card.addEventListener("click", async function () {
          card.disabled = true;
          var original = card.innerHTML;
          card.innerHTML = '<div style="padding:16px 0;font-weight:800">Sending…</div>';
          var res = await sb.rpc("send_gift", {
            p_recipient: roomState.stream.host_id,
            p_gift: g.id,
            p_stream: roomState.stream.id,
            p_idempotency: newUuid()
          });
          if (res.error) {
            var m = errText(res.error);
            if (/insufficient|balance/i.test(m)) m = "Not enough coins — your balance is " + Number(roomState.balance || 0).toLocaleString() + " and this gift costs " + Number(g.price_coins).toLocaleString() + ".";
            toast("Gift failed: " + m);
            card.disabled = false; card.innerHTML = original;
            return;
          }
          var w = await sb.from("wallets").select("balance").eq("user_id", me.id).maybeSingle();
          if (w.data) {
            roomState.balance = Number(w.data.balance);
            $("#topBalance").textContent = roomState.balance.toLocaleString();
          }
          closeSheet();
          var hostProf = roomState.profiles[roomState.stream.host_id];
          showGiftFx(g, displayName(me));
          toast("You sent a " + g.name + " to " + displayName(hostProf) + "! New balance: " + Number(roomState.balance || 0).toLocaleString() + " coins.");
        });
        grid.appendChild(card);
      });
    }

    /* ---------------- MY PROFILE + SETTINGS ---------------- */
    async function renderMyProfile(done) {
      var wrap = el("<div></div>");
      var counts = await Promise.all([
        sb.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id),
        sb.from("follows").select("follower_id", { count: "exact", head: true }).eq("follower_id", me.id)
      ]);
      var p = me;
      wrap.innerHTML =
        (p.cover_url ? '<img class="cover-img" src="' + esc(p.cover_url) + '" alt="" style="margin-top:12px" />' : '<div class="cover-img" style="margin-top:12px"></div>') +
        '<div style="display:flex;gap:14px;align-items:flex-end;margin-top:-38px;padding:0 10px;position:relative">' + avatarHtml(p, 84) +
        '<div style="padding-bottom:4px"><div style="font-weight:800;font-size:19px;display:flex;gap:8px;align-items:center">' + esc(displayName(p)) + ' <span class="online-dot"></span></div>' +
        '<div class="faint">@' + esc(p.username) + "</div></div></div>" +
        (p.bio ? '<p style="margin:14px 2px 0;overflow-wrap:anywhere">' + esc(p.bio) + "</p>" : "") +
        ((p.interests && p.interests.length) ? '<div class="row-gap mt">' + p.interests.map(function (i) { return '<span class="chip">' + esc(i) + "</span>"; }).join("") + "</div>" : "") +
        '<div class="stat-row mt" style="margin-left:2px"><div class="stat"><b>' + (counts[0].count || 0) + "</b><span>Followers</span></div>" +
        '<div class="stat"><b>' + (counts[1].count || 0) + "</b><span>Following</span></div></div>" +
        profileLinksHtml(p) +
        '<button type="button" class="menu-row" id="mWallet"><span>My wallet</span><span style="display:inline-flex;align-items:center;gap:7px"><span class="coin-ic"></span><span id="mBalance">' + esc($("#topBalance").textContent) + "</span> ›</span></button>" +
        '<button type="button" class="menu-row" id="mSettings"><span>Edit profile &amp; settings</span><span class="faint">›</span></button>' +
        '<button type="button" class="menu-row" id="mSignOut"><span>Sign out</span><span class="faint">›</span></button>' +
        '<p class="small faint" style="text-align:center;margin-top:20px">Signed in as ' + esc(mySession && mySession.user ? mySession.user.email : "") + "</p>";
      done(wrap);
      wrap.querySelector("#mWallet").addEventListener("click", openWallet);
      wrap.querySelector("#mSettings").addEventListener("click", openSettings);
      wrap.querySelector("#mSignOut").addEventListener("click", doSignOut);
      refreshWalletChip();
    }

    async function uploadProfileImage(bucket, file) {
      var path = me.id + "/" + newUuid() + "-" + file.name.replace(/[^\w.\-]+/g, "_");
      var up = await sb.storage.from(bucket).upload(path, file, { upsert: true });
      if (up.error) throw up.error;
      return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    }

    function openSettings() {
      var p = me;
      var links = p.links || {};
      var ov = openOverlay(
        '<div class="overlay-bar"><button type="button" class="back-btn" id="sBack">‹ Back</button>' +
        '<h2 style="margin:0;font-size:20px">Edit profile</h2></div>' +
        '<div class="card stack">' +
          '<div style="display:flex;gap:16px;align-items:center"><div id="sAvatarPrev">' + avatarHtml(p, 72) + "</div>" +
          '<div><label class="btn ghost small" for="sAvatar" style="cursor:pointer">Change photo</label>' +
          '<input type="file" id="sAvatar" accept="image/*" class="hidden" /><div class="small faint" style="margin-top:5px">Square photos look best</div></div></div>' +
          '<div><label class="btn ghost small" for="sCover" style="cursor:pointer">Change cover photo</label>' +
          '<input type="file" id="sCover" accept="image/*" class="hidden" /></div>' +
        "</div>" +
        '<form id="sForm" class="mt">' +
          '<div class="field"><label for="sUsername">Username (lowercase, 3–24 characters)</label>' +
          '<input class="input" id="sUsername" value="' + esc(p.username) + '" maxlength="24" /></div>' +
          '<div class="field"><label for="sName">Display name</label>' +
          '<input class="input" id="sName" value="' + esc(p.display_name || "") + '" maxlength="60" /></div>' +
          '<div class="field"><label for="sBio">Bio</label>' +
          '<textarea class="textarea" id="sBio" maxlength="300">' + esc(p.bio || "") + "</textarea></div>" +
          '<div class="field"><label for="sInterests">Interests (separate with commas)</label>' +
          '<input class="input" id="sInterests" value="' + esc((p.interests || []).join(", ")) + '" /></div>' +
          '<div class="field"><label for="sWeb">Website link</label>' +
          '<input class="input" id="sWeb" type="url" value="' + esc(links.website || "") + '" placeholder="https://…" /></div>' +
          '<div class="field"><label for="sInsta">Instagram link</label>' +
          '<input class="input" id="sInsta" type="url" value="' + esc(links.instagram || "") + '" placeholder="https://…" /></div>' +
          '<div class="field"><label for="sTiktok">TikTok link</label>' +
          '<input class="input" id="sTiktok" type="url" value="' + esc(links.tiktok || "") + '" placeholder="https://…" /></div>' +
          '<div class="field"><label for="sThrone">Throne wishlist link</label>' +
          '<input class="input" id="sThrone" type="url" value="' + esc(p.throne_link || "") + '" placeholder="https://throne.com/…" /></div>' +
          '<div class="card" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><b>Show when I\'m online</b>' +
          '<div class="small muted">When off, nobody sees your green online dot.</div></div>' +
          '<button type="button" class="switch' + (p.show_online !== false ? " on" : "") + '" id="sOnline" aria-label="Toggle show online status"></button></div>' +
          '<div id="sMsg" style="margin-top:14px"></div>' +
          '<button class="btn primary block mt" type="submit" id="sSave" style="min-height:58px">Save changes</button>' +
        "</form>"
      );
      ov.querySelector("#sBack").addEventListener("click", function () { closeOverlay(); });
      var showOnline = p.show_online !== false;
      ov.querySelector("#sOnline").addEventListener("click", function () {
        showOnline = !showOnline;
        this.classList.toggle("on", showOnline);
      });
      ov.querySelector("#sAvatar").addEventListener("change", async function () {
        var f = this.files && this.files[0];
        if (!f) return;
        try {
          toast("Uploading photo…");
          var url = await uploadProfileImage("avatars", f);
          var u = await sb.from("profiles").update({ avatar_url: url }).eq("id", me.id).select("*").single();
          if (u.error) throw u.error;
          me = u.data; profileCache[me.id] = me;
          ov.querySelector("#sAvatarPrev").innerHTML = avatarHtml(me, 72);
          toast("Profile photo updated!");
        } catch (e) { toast("Photo upload failed: " + errText(e)); }
      });
      ov.querySelector("#sCover").addEventListener("change", async function () {
        var f = this.files && this.files[0];
        if (!f) return;
        try {
          toast("Uploading cover…");
          var url = await uploadProfileImage("covers", f);
          var u = await sb.from("profiles").update({ cover_url: url }).eq("id", me.id).select("*").single();
          if (u.error) throw u.error;
          me = u.data; profileCache[me.id] = me;
          toast("Cover photo updated!");
        } catch (e) { toast("Cover upload failed: " + errText(e)); }
      });
      ov.querySelector("#sForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var msg = ov.querySelector("#sMsg");
        var btn = ov.querySelector("#sSave");
        var username = ov.querySelector("#sUsername").value.trim().toLowerCase();
        if (!/^[a-z0-9_.-]{3,24}$/.test(username)) {
          msg.innerHTML = '<div class="err-box">Username must be 3–24 characters: lowercase letters, numbers, dots, dashes or underscores.</div>';
          return;
        }
        var newLinks = {};
        var web = ov.querySelector("#sWeb").value.trim();
        var insta = ov.querySelector("#sInsta").value.trim();
        var tiktok = ov.querySelector("#sTiktok").value.trim();
        if (web) newLinks.website = web;
        if (insta) newLinks.instagram = insta;
        if (tiktok) newLinks.tiktok = tiktok;
        var interests = ov.querySelector("#sInterests").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 12);
        btn.disabled = true; btn.textContent = "Saving…";
        var u = await sb.from("profiles").update({
          username: username,
          display_name: ov.querySelector("#sName").value.trim() || null,
          bio: ov.querySelector("#sBio").value.trim() || null,
          interests: interests,
          links: newLinks,
          throne_link: ov.querySelector("#sThrone").value.trim() || null,
          show_online: showOnline
        }).eq("id", me.id).select("*").single();
        btn.disabled = false; btn.textContent = "Save changes";
        if (u.error) {
          var m = errText(u.error);
          if (/duplicate|unique/i.test(m)) m = "That username is already taken — try another.";
          msg.innerHTML = '<div class="err-box">' + esc(m) + "</div>";
          return;
        }
        me = u.data; profileCache[me.id] = me;
        msg.innerHTML = '<div class="ok-box">Saved! Your profile is updated everywhere.</div>';
        toast("Profile saved.");
      });
    }

    /* ---------------- offline banner ---------------- */
    function syncOffline() { $("#offlineBar").classList.toggle("show", !navigator.onLine); }
    window.addEventListener("online", syncOffline);
    window.addEventListener("offline", syncOffline);

    /* ---------------- boot ---------------- */
    (function boot() {
      if (!sb) {
        showBoot("The app library couldn't load. Check your internet connection and refresh the page.");
        var bs = $("#bootSpinner"); if (bs) bs.style.display = "none";
        return;
      }
      if (!window.LivekitClient) {
        // Streaming library failed to load — the app still works; the stream
        // room shows an honest connection error when opened.
        console.warn("LiveKit client library not loaded.");
      }
      initAuth();
      syncOffline();
      sb.auth.onAuthStateChange(function (event, session) {
        if (event === "SIGNED_OUT") { mySession = null; }
        if (session) mySession = session;
      });
      sb.auth.getSession().then(async function (res) {
        var session = res.data ? res.data.session : null;
        if (session) {
          try { await enterApp(session); }
          catch (e) { showAuth(); }
        } else {
          showAuth();
        }
      }).catch(function () { showAuth(); });
    })();
    </script>
  </body>
</html>
