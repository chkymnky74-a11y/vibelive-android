# VibeLive Android — free cloud build (GitHub Actions)
#
# Builds the VibeLive Android app in the cloud because Gradle cannot run
# in the local VM (Java cross-process loopback TCP is blocked there).
# Package: com.shelleywrites.vibelive, version 0.1.0, versionCode 1.
#
# The release AAB built here is UNSIGNED on purpose. Signing is a later
# secure step (upload keystore + Play App Signing). Nothing here spends
# money, submits anything to Play Console, or contains any secret: only
# the public Supabase publishable key ships in the app, exactly as in
# the web version.

name: Build VibeLive Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install the Android packages we need
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install the app's Node packages
        run: npm ci

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=1
        working-directory: android

      - name: Build the unsigned release AAB
        run: ./gradlew bundleRelease --no-daemon --max-workers=1
        working-directory: android

      - name: Check what was built
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | grep -E "base/assets/public/index.html|AndroidManifest.xml" || true

      - name: Save the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibelive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save the unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vibelive-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Sign the release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is not set. Add it in the repo Settings, Secrets and variables, Actions, then re-run this workflow."
            exit 1
          fi
          cd android
          if [ -f upload-keystore.enc ]; then
            echo "Decrypting existing upload keystore"
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -pass pass:"$KEYSTORE_PASSWORD" -in upload-keystore.enc -out upload-keystore.jks
          else
            echo "Creating new upload keystore and saving it encrypted in the repo"
            keytool -genkeypair -v -keystore upload-keystore.jks -alias vibelive-upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=VibeLive, O=Mizzfitt App Studio, C=CA"
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$KEYSTORE_PASSWORD" -in upload-keystore.jks -out upload-keystore.enc
            git config user.name "vibelive-build"
            git config user.email "build@vibelive.local"
            git add upload-keystore.enc
            git commit -m "Add encrypted upload keystore for Play Console signing [skip ci]"
            git push
          fi
          cp app/build/outputs/bundle/release/app-release.aab app-release-signed.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" app-release-signed.aab vibelive-upload
          jarsigner -verify app-release-signed.aab
          rm -f upload-keystore.jks

      - name: Save the signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vibelive-release-aab-signed
          path: android/app-release-signed.aab
